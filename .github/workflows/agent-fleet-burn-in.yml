name: Agent Fleet Burn-in

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Long-running three-node Fleet profile."
        required: true
        default: "standard"
        type: choice
        options:
          - "standard"
          - "extended"
      confirmation:
        description: "Enter RUN-STANDARD-FLEET or RUN-EXTENDED-FLEET."
        required: true
        type: string
      change_reference:
        description: "Ticket or change reference for the runner budget."
        required: true
        type: string
      baseline_run_id:
        description: "Successful Standard Fleet run ID required by the Extended regression gate."
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: agent-fleet-burn-in-${{ github.repository }}
  cancel-in-progress: false

jobs:
  fleet-burn-in:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: ${{ inputs.profile == 'extended' && 'agent-fleet-extended' || 'agent-fleet-standard' }}
    env:
      FLEET_PROFILE: ${{ inputs.profile }}
      FLEET_CONFIRMATION: ${{ inputs.confirmation }}
      FLEET_CHANGE_REFERENCE: ${{ inputs.change_reference }}
      FLEET_ENVIRONMENT_PROFILE: ${{ vars.RCA_AGENT_FLEET_PROFILE }}
      KIND_CLUSTER_NAME: rca-fleet-${{ github.run_id }}
      RCA_AGENT_SOAK_PROFILE: ${{ inputs.profile }}
      RCA_AGENT_SOAK_MINIMUM_PODS: "3"
      RCA_AGENT_SOAK_OUTPUT_DIR: validation-results/agent-fleet-burn-in
      RCA_AGENT_SOAK_PLATFORM_FAMILY: kind
      RCA_AGENT_SOAK_ARCHITECTURE: amd64
      RCA_AGENT_SOAK_AGENT_VERSION: ${{ github.sha }}
      FLEET_BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate approved campaign inputs
        shell: bash
        run: |
          set -euo pipefail
          case "${FLEET_PROFILE}" in
            standard|extended) ;;
            *) echo "profile must be standard or extended" >&2; exit 2 ;;
          esac
          if [ "${FLEET_ENVIRONMENT_PROFILE}" != "${FLEET_PROFILE}" ]; then
            echo "the selected Environment is missing its RCA_AGENT_FLEET_PROFILE marker" >&2
            exit 2
          fi
          expected="RUN-$(printf '%s' "${FLEET_PROFILE}" | tr '[:lower:]' '[:upper:]')-FLEET"
          if [ "${FLEET_CONFIRMATION}" != "${expected}" ]; then
            echo "confirmation must be ${expected}" >&2
            exit 2
          fi
          if ! [[ "${FLEET_CHANGE_REFERENCE}" =~ ^[A-Za-z0-9._:/#-]{3,100}$ ]]; then
            echo "change_reference contains unsupported characters" >&2
            exit 2
          fi
          if [ "${FLEET_PROFILE}" = "extended" ] && ! [[ "${FLEET_BASELINE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "extended profile requires a successful Standard Fleet baseline_run_id" >&2
            exit 2
          fi
          python3 -m py_compile scripts/agent-soak-validation.py scripts/agent-soak-comparison.py
          python3 scripts/release-readiness-check.py >/dev/null

      - name: Download approved Standard Fleet baseline
        if: ${{ inputs.profile == 'extended' }}
        uses: actions/download-artifact@v8
        with:
          name: agent-fleet-standard-${{ inputs.baseline_run_id }}
          path: validation-results/agent-fleet-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_run_id }}

      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: config/kind-multi-node.yaml

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Run long-running three-node Agent Fleet validation
        shell: bash
        run: bash scripts/kind-smoke.sh

      - name: Gate Extended Fleet against Standard baseline
        if: ${{ inputs.profile == 'extended' }}
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="validation-results/agent-fleet-baseline"
          candidate_dir="${RCA_AGENT_SOAK_OUTPUT_DIR}"
          temporary_dir="${RUNNER_TEMP}/rca-agent-fleet-baseline-${GITHUB_RUN_ID}"
          mkdir -p "${temporary_dir}"
          python3 scripts/agent-soak-revalidate.py \
            --summary "${baseline_dir}/agent-soak-summary.json" \
            --checkpoints "${baseline_dir}/agent-soak-checkpoints.jsonl" \
            --output "${temporary_dir}/agent-soak-summary.json"
          python3 scripts/agent-soak-comparison.py \
            --baseline "${temporary_dir}/agent-soak-summary.json" \
            --candidate "${candidate_dir}/agent-soak-summary.json" \
            --policy config/agent-soak-comparison-policy.json \
            --output "${candidate_dir}/agent-soak-comparison.json"

      - name: Publish Fleet result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("validation-results/agent-fleet-burn-in/agent-soak-summary.json")
          output = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not path.exists():
              output.write_text("## Agent Fleet Burn-in\n\nSummary was not produced.\n", encoding="utf-8")
              raise SystemExit(0)
          payload = json.loads(path.read_text(encoding="utf-8"))
          comparison_path = path.parent / "agent-soak-comparison.json"
          comparison = json.loads(comparison_path.read_text(encoding="utf-8")) if comparison_path.exists() else None
          fleet = payload.get("metrics", {}).get("fleet", {})
          collector_execution = payload.get("metrics", {}).get("collector_execution", {})
          variation = fleet.get("variation", {})
          rss_spread = variation.get("rss_peak_bytes", {}).get("spread")
          rss_mib = rss_spread / 1024 / 1024 if isinstance(rss_spread, (int, float)) else None
          steady = fleet.get("worst_rss_steady_state", {})
          steady_slope = steady.get("maximum_slope_bytes_per_hour")
          steady_slope_mib = (
              steady_slope / 1024 / 1024 if isinstance(steady_slope, (int, float)) else None
          )
          steady_range = steady.get("maximum_range_bytes")
          steady_range_mib = (
              steady_range / 1024 / 1024 if isinstance(steady_range, (int, float)) else None
          )
          lines = [
              "## Agent Fleet Burn-in",
              "",
              f"- Status: `{payload.get('status', 'unknown')}`",
              f"- Profile: `{payload.get('profile', 'unknown')}`",
              f"- Targets passed: `{fleet.get('passed_target_count', 0)}/{fleet.get('target_count', 0)}`",
              f"- Iterations: `{payload.get('metrics', {}).get('iterations_completed', 0)}`",
              f"- Collector source: `{collector_execution.get('source', 'unknown')}`",
              f"- Agent evidence observations: `{collector_execution.get('successful_observations', 0)}/{collector_execution.get('observation_count', 0)}`",
              f"- RSS peak spread: `{rss_mib:.2f} MiB`" if rss_mib is not None else "- RSS peak spread: `unavailable`",
              (
                  f"- Worst steady RSS slope: `{steady_slope_mib:.3f} MiB/hour`"
                  if steady_slope_mib is not None else "- Worst steady RSS slope: `unavailable`"
              ),
              (
                  f"- Worst steady RSS range: `{steady_range_mib:.2f} MiB`"
                  if steady_range_mib is not None else "- Worst steady RSS range: `unavailable`"
              ),
              f"- Runtime errors: `{payload.get('metrics', {}).get('runtime_observation_errors', 0)}`",
              f"- Failures: `{len(payload.get('failures') or [])}`",
          ]
          if comparison is not None:
              lines.extend(
                  [
                      f"- Baseline comparison: `{comparison.get('status', 'unknown')}`",
                      f"- Compatibility gate: `{comparison.get('compatibility', {}).get('status', 'unknown')}`",
                      f"- Absolute gate: `{comparison.get('absolute_gate', {}).get('status', 'unknown')}`",
                      f"- Regression gate: `{comparison.get('regression_gate', {}).get('status', 'unknown')}`",
                  ]
              )
          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload Fleet burn-in result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-fleet-${{ inputs.profile }}-${{ github.run_id }}
          path: validation-results/agent-fleet-burn-in
          if-no-files-found: warn
          retention-days: ${{ inputs.profile == 'extended' && 90 || 30 }}
