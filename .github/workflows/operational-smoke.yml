name: Operational Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Platform base URL. Defaults to repository variable RCA_SMOKE_BASE_URL."
        required: false
        type: string
      username:
        description: "Platform username. Defaults to RCA_SMOKE_USERNAME or admin."
        required: false
        default: "admin"
        type: string
      scenarios:
        description: "Comma-separated scenario keys or all."
        required: true
        default: "disk-pressure"
        type: string
      task_timeout_seconds:
        description: "Maximum seconds to wait for each RCA task."
        required: true
        default: "180"
        type: string
      use_tailscale:
        description: "Connect this runner to Tailscale before validation."
        required: true
        default: true
        type: boolean
      skip_audit_check:
        description: "Skip audit event verification for non-admin validation users."
        required: true
        default: false
        type: boolean
      run_llm_smoke:
        description: "Also run LLM staging smoke against the same platform."
        required: true
        default: false
        type: boolean
      llm_scenario:
        description: "Demo scenario key for LLM staging smoke."
        required: false
        default: "disk-pressure"
        type: string
      llm_expected_status:
        description: "Comma-separated acceptable llm_analysis statuses."
        required: false
        default: "completed"
        type: string
      llm_allow_disabled:
        description: "Allow LLM smoke to pass when LLM is disabled."
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      base_url:
        required: true
        type: string
      username:
        required: false
        type: string
        default: "admin"
      scenarios:
        required: false
        type: string
        default: "disk-pressure"
      task_timeout_seconds:
        required: false
        type: string
        default: "180"
      use_tailscale:
        required: false
        type: boolean
        default: true
      skip_audit_check:
        required: false
        type: boolean
        default: false
      run_llm_smoke:
        required: false
        type: boolean
        default: false
      llm_scenario:
        required: false
        type: string
        default: "disk-pressure"
      llm_expected_status:
        required: false
        type: string
        default: "completed"
      llm_allow_disabled:
        required: false
        type: boolean
        default: false
    secrets:
      RCA_SMOKE_PASSWORD:
        required: true
      RCA_BUNDLE_SIGNATURE_SECRET:
        required: false
      TAILSCALE_AUTHKEY:
        required: false

permissions:
  contents: read

jobs:
  operational-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_BASE_URL: ${{ inputs.base_url || vars.RCA_SMOKE_BASE_URL }}
      SMOKE_USERNAME: ${{ inputs.username || vars.RCA_SMOKE_USERNAME || 'admin' }}
      SMOKE_PASSWORD: ${{ secrets.RCA_SMOKE_PASSWORD }}
      SMOKE_SCENARIOS: ${{ inputs.scenarios || 'disk-pressure' }}
      SMOKE_TASK_TIMEOUT_SECONDS: ${{ inputs.task_timeout_seconds || '180' }}
      SMOKE_SKIP_AUDIT_CHECK: ${{ inputs.skip_audit_check }}
      SMOKE_BUNDLE_SIGNATURE_SECRET: ${{ secrets.RCA_BUNDLE_SIGNATURE_SECRET }}
      SMOKE_BUNDLE_SIGNATURE_KEY_ID: ${{ vars.RCA_BUNDLE_SIGNATURE_KEY_ID }}
      LLM_SMOKE_SCENARIO: ${{ inputs.llm_scenario || 'disk-pressure' }}
      LLM_SMOKE_EXPECTED_STATUS: ${{ inputs.llm_expected_status || 'completed' }}
      LLM_SMOKE_ALLOW_DISABLED: ${{ inputs.llm_allow_disabled }}
      LLM_SMOKE_REQUIRE_USAGE_METADATA: ${{ vars.RCA_LLM_SMOKE_REQUIRE_USAGE_METADATA || 'false' }}
      LLM_SMOKE_MAX_LATENCY_MS: ${{ vars.RCA_LLM_SMOKE_MAX_LATENCY_MS || '60000' }}
      LLM_SMOKE_MAX_ESTIMATED_COST_USD: ${{ vars.RCA_LLM_SMOKE_MAX_ESTIMATED_COST_USD || '0' }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require Tailscale auth key
        if: ${{ inputs.use_tailscale && env.TAILSCALE_AUTHKEY == '' }}
        run: |
          echo "TAILSCALE_AUTHKEY secret is required when use_tailscale is true." >&2
          exit 2

      - name: Connect runner to Tailscale
        if: ${{ inputs.use_tailscale && env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Validate smoke script syntax
        run: |
          python -m py_compile \
            scripts/operational_scenario_validation.py \
            scripts/llm-staging-smoke.py

      - name: Run operational smoke validation
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL}" ]; then
            echo "SMOKE_BASE_URL is empty. Set workflow input base_url or repository variable RCA_SMOKE_BASE_URL." >&2
            exit 2
          fi
          if [ -z "${SMOKE_PASSWORD}" ]; then
            echo "RCA_SMOKE_PASSWORD secret is required." >&2
            exit 2
          fi

          args=(
            --base-url "${SMOKE_BASE_URL}"
            --username "${SMOKE_USERNAME}"
            --password "${SMOKE_PASSWORD}"
            --scenarios "${SMOKE_SCENARIOS}"
            --task-timeout-seconds "${SMOKE_TASK_TIMEOUT_SECONDS}"
            --output-dir validation-results/operational-smoke
          )
          if [ "${SMOKE_SKIP_AUDIT_CHECK}" = "true" ]; then
            args+=(--skip-audit-check)
          fi
          if [ -n "${SMOKE_BUNDLE_SIGNATURE_SECRET}" ]; then
            args+=(--bundle-signature-secret "${SMOKE_BUNDLE_SIGNATURE_SECRET}")
          fi
          if [ -n "${SMOKE_BUNDLE_SIGNATURE_KEY_ID}" ]; then
            args+=(--bundle-signature-key-id "${SMOKE_BUNDLE_SIGNATURE_KEY_ID}")
          fi

          python scripts/operational_scenario_validation.py "${args[@]}"

      - name: Run LLM staging smoke validation
        if: ${{ inputs.run_llm_smoke }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL}" ]; then
            echo "SMOKE_BASE_URL is empty. Set workflow input base_url or repository variable RCA_SMOKE_BASE_URL." >&2
            exit 2
          fi
          if [ -z "${SMOKE_PASSWORD}" ]; then
            echo "RCA_SMOKE_PASSWORD secret is required." >&2
            exit 2
          fi

          args=(
            --base-url "${SMOKE_BASE_URL}"
            --username "${SMOKE_USERNAME}"
            --password "${SMOKE_PASSWORD}"
            --scenario "${LLM_SMOKE_SCENARIO}"
            --expected-llm-status "${LLM_SMOKE_EXPECTED_STATUS}"
            --max-llm-latency-ms "${LLM_SMOKE_MAX_LATENCY_MS}"
            --max-estimated-cost-usd "${LLM_SMOKE_MAX_ESTIMATED_COST_USD}"
            --task-timeout-seconds "${SMOKE_TASK_TIMEOUT_SECONDS}"
            --output-dir validation-results/llm-staging-smoke
          )
          if [ "${LLM_SMOKE_ALLOW_DISABLED}" = "true" ]; then
            args+=(--allow-disabled)
          fi
          if [ "${LLM_SMOKE_REQUIRE_USAGE_METADATA}" = "true" ]; then
            args+=(--require-usage-metadata)
          fi

          python scripts/llm-staging-smoke.py "${args[@]}"

      - name: Upload smoke validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operational-smoke-results
          path: |
            validation-results/operational-smoke
            validation-results/llm-staging-smoke
          if-no-files-found: ignore
