name: Publish Edge Images

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: publish-edge-images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: platform
            dockerfile: Dockerfile.web-console
            image: cluster-infra-rca-platform
          - component: agent
            dockerfile: Dockerfile.agent
            image: cluster-infra-rca-agent

    steps:
      - name: Resolve source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            sha="${WORKFLOW_RUN_SHA}"
          else
            sha="${GITHUB_SHA}"
          fi
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved source revision is not a full commit SHA." >&2
            exit 1
          fi
          short_sha="${sha:0:12}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=0.1.0-edge.${GITHUB_RUN_NUMBER}+${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify manually selected revision passed CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          successful_runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${SOURCE_SHA}" \
            -f event=push \
            -f status=success \
            -f per_page=1 \
            --jq '.workflow_runs | length')"
          if [ "${successful_runs}" -lt 1 ]; then
            echo "Refusing to publish ${SOURCE_SHA}: no successful main push CI run was found." >&2
            exit 1
          fi

      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=edge
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            VCS_REF=${{ steps.source.outputs.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=edge-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=edge-${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Add published image to job summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          {
            echo "### ${{ matrix.component }} image"
            echo
            echo "- \`${IMAGE}:edge\`"
            echo "- \`${IMAGE}:sha-${SHORT_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
