name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  node-agent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q node_agent tests
      - name: Test Node Agent
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-console/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-console/frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  web-console-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: web-console/pom.xml
      - name: Test and package Spring Boot platform
        working-directory: web-console
        run: mvn --batch-mode --no-transfer-progress verify

  helm-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Lint Helm charts
        run: |
          helm lint charts/cluster-infra-rca-platform
          helm lint charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set secret.create=true \
            --set secret.clusterId=cluster-test \
            --set secret.agentToken=agent-token
      - name: Render platform chart variants
        run: |
          set -euo pipefail
          helm template rca charts/cluster-infra-rca-platform > /dev/null
          helm template rca charts/cluster-infra-rca-platform \
            --set database.type=mariadb > /dev/null
          helm template rca charts/cluster-infra-rca-platform \
            --set database.enabled=false \
            --set-string platform.secret.jdbcUrl=jdbc:postgresql://postgres.example:5432/rca \
            --set-string platform.secret.databaseUsername=rca \
            --set-string platform.secret.databasePassword=non-default-password > /dev/null
          helm template rca charts/cluster-infra-rca-platform \
            --set platform.config.springProfiles=prod \
            --set platform.config.publicApiBaseUrl=https://rca.example.com \
            --set-string platform.secret.defaultAdminUsername=platform-admin \
            --set-string platform.secret.defaultAdminPassword=non-default-admin-password \
            --set-string platform.secret.webhookToken=non-default-webhook-token \
            --set-string platform.secret.encryptionSecret=non-default-encryption-secret \
            --set-string database.auth.password=non-default-database-password > /dev/null
          llm_openai="$(helm template rca charts/cluster-infra-rca-platform \
            --set platform.config.llmEnabled=true \
            --set platform.config.llmProvider=openai_compatible \
            --set platform.config.springAiChatModel=openai-sdk \
            --set-string platform.config.llmModel=provider-model-name \
            --set-string platform.secret.openaiApiKey=not-a-real-key \
            --set-string platform.secret.openaiBaseUrl=https://llm-gateway.example.com/v1)"
          grep -q 'RCA_LLM_PROVIDER' <<< "$llm_openai"
          grep -q 'SPRING_AI_OPENAI_SDK_API_KEY' <<< "$llm_openai"
          grep -q 'SPRING_AI_OPENAI_SDK_BASE_URL' <<< "$llm_openai"
          llm_self_hosted="$(helm template rca charts/cluster-infra-rca-platform \
            --set platform.config.llmEnabled=true \
            --set platform.config.llmProvider=self_hosted \
            --set platform.config.springAiChatModel=openai-sdk \
            --set-string platform.config.llmModel=local-rca-model \
            --set-string platform.secret.openaiBaseUrl=http://llm-gateway.rca-system.svc:8000/v1)"
          grep -q 'RCA_LLM_PROVIDER' <<< "$llm_self_hosted"
          grep -q 'SPRING_AI_OPENAI_SDK_BASE_URL' <<< "$llm_self_hosted"
      - name: Render Agent chart variants
        run: |
          helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set secret.create=true \
            --set secret.clusterId=cluster-test \
            --set secret.agentToken=agent-token > /dev/null
          helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set tls.enabled=true \
            --set tls.existingSecret=agent-mtls \
            --set secret.existingSecret.name=agent-auth > /dev/null
          helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set mode=ebpf \
            --set ebpf.enabled=true \
            --set secret.existingSecret.name=agent-auth > /dev/null

  release-readiness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile operational scripts
        run: |
          python -m py_compile \
            scripts/release-readiness-check.py \
            scripts/daemonset_operational_check.py \
            scripts/operational_scenario_validation.py \
            scripts/llm-staging-smoke.py
      - name: Validate release readiness contracts
        run: python scripts/release-readiness-check.py

  docker-build:
    needs:
      - node-agent-test
      - frontend-build
      - web-console-test
      - helm-validate
      - release-readiness-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - component: platform
            dockerfile: Dockerfile.web-console
          - component: agent
            dockerfile: Dockerfile.agent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: cluster-infra-rca-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  agent-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate collector on common Linux distributions
        run: bash scripts/validate-agent-distributions.sh

  database-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate PostgreSQL and MariaDB restore
        run: bash scripts/validate-database-backup.sh

  kind-smoke:
    needs:
      - helm-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: rca-smoke
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Run Kubernetes end-to-end smoke test
        run: bash scripts/kind-smoke.sh
