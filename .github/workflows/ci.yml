name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  node-agent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q node_agent tests
      - name: Test Node Agent
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-console/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-console/frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test console data and authentication states
        run: npm test
      - name: Type-check and build
        run: npm run build

  web-console-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: web-console/pom.xml
      - name: Test and package Spring Boot platform
        working-directory: web-console
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Require PostgreSQL and MariaDB compatibility tests
        run: python3 scripts/verify_database_compatibility_report.py
      - name: Upload RCA analysis quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rule-analysis-quality
          path: |
            web-console/target/analysis-quality-report.json
            web-console/target/production-like-evidence-corpus-report.json
            web-console/target/blind-evaluation-report.json
          if-no-files-found: error
          retention-days: 30

  console-workflow-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: web-console/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-console/frontend/package-lock.json
      - name: Package isolated E2E platform
        run: mvn --batch-mode --no-transfer-progress -f web-console/pom.xml -Pfrontend -DskipTests package
      - name: Install Playwright Chromium
        working-directory: web-console/frontend
        run: npx playwright install --with-deps chromium
      - name: Run console workflow E2E
        working-directory: web-console/frontend
        env:
          CONSOLE_BASE_URL: http://127.0.0.1:18087
          CONSOLE_E2E_SERVER_COMMAND: java -jar ../target/cluster-infra-rca-platform-0.1.0.jar
          CONSOLE_USERNAME: e2e-admin
          CONSOLE_PASSWORD: e2e-password-123
        run: npm run e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: console-workflow-e2e
          path: |
            web-console/frontend/playwright-report
            web-console/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  helm-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROMETHEUS_VERSION: 3.12.0
      PROMETHEUS_LINUX_AMD64_SHA256: 20da47f8e5303f74aecb78edd7f7e39041dac08ac4939dba75efd7a900ae8867
      ALERTMANAGER_VERSION: 0.33.1
      ALERTMANAGER_LINUX_AMD64_SHA256: 93d802cba6a8d27239d747ce117df7648d326ab67394e32247540b030e9842ba
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Install pinned Prometheus tools
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}"
          sudo install "prometheus-${PROMETHEUS_VERSION}.linux-amd64/prometheus" /usr/local/bin/prometheus
          sudo install "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
      - name: Install pinned Alertmanager
        run: |
          set -euo pipefail
          archive="alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/${archive}"
          echo "${ALERTMANAGER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}"
          sudo install "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/alertmanager" /usr/local/bin/alertmanager
      - name: Lint Helm charts
        run: |
          helm lint charts/cluster-infra-rca-platform
          helm lint charts/cluster-infra-rca-platform \
            --values charts/cluster-infra-rca-platform/values-production.yaml \
            --set-string platform.image.repository=ghcr.io/example/cluster-infra-rca-web-console \
            --set-string platform.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          if helm template rca charts/cluster-infra-rca-platform \
            --values charts/cluster-infra-rca-platform/values-production.yaml >/dev/null 2>&1; then
            echo "production values must reject an unpinned platform image" >&2
            exit 1
          fi
          helm lint charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set secret.create=true \
            --set secret.clusterId=cluster-test \
            --set secret.agentToken=agent-token
      - name: Render platform chart variants
        run: |
          set -euo pipefail
          helm template rca charts/cluster-infra-rca-platform > /dev/null
          production="$(helm template rca charts/cluster-infra-rca-platform \
            --values charts/cluster-infra-rca-platform/values-production.yaml \
            --set-string platform.image.repository=ghcr.io/example/cluster-infra-rca-web-console \
            --set-string platform.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa)"
          grep -q 'replicas: 2' <<< "${production}"
          grep -q 'readOnlyRootFilesystem: true' <<< "${production}"
          grep -q 'kind: NetworkPolicy' <<< "${production}"
          grep -q 'image: "ghcr.io/example/cluster-infra-rca-web-console@sha256:' <<< "${production}"
          helm template rca charts/cluster-infra-rca-platform \
            --set database.type=mariadb > /dev/null
          helm template rca charts/cluster-infra-rca-platform \
            --set database.enabled=false \
            --set-string platform.secret.jdbcUrl=jdbc:postgresql://postgres.example:5432/rca \
            --set-string platform.secret.databaseUsername=rca \
            --set-string platform.secret.databasePassword=non-default-password > /dev/null
          llm_openai="$(helm template rca charts/cluster-infra-rca-platform \
            --set platform.config.llmEnabled=true \
            --set platform.config.llmProvider=openai_compatible \
            --set platform.config.springAiChatModel=openai-sdk \
            --set-string platform.config.llmModel=provider-model-name \
            --set-string platform.secret.openaiApiKey=not-a-real-key \
            --set-string platform.secret.openaiBaseUrl=https://llm-gateway.example.com/v1)"
          grep -q 'RCA_LLM_PROVIDER' <<< "$llm_openai"
          grep -q 'SPRING_AI_OPENAI_SDK_API_KEY' <<< "$llm_openai"
          grep -q 'SPRING_AI_OPENAI_SDK_BASE_URL' <<< "$llm_openai"
          llm_self_hosted="$(helm template rca charts/cluster-infra-rca-platform \
            --set platform.config.llmEnabled=true \
            --set platform.config.llmProvider=self_hosted \
            --set platform.config.springAiChatModel=openai-sdk \
            --set-string platform.config.llmModel=local-rca-model \
            --set-string platform.secret.openaiBaseUrl=http://llm-gateway.rca-system.svc:8000/v1)"
          grep -q 'RCA_LLM_PROVIDER' <<< "$llm_self_hosted"
          grep -q 'SPRING_AI_OPENAI_SDK_BASE_URL' <<< "$llm_self_hosted"
          llm_rules="$(helm template rca charts/cluster-infra-rca-platform \
            --set platform.prometheusRule.enabled=true \
            --set platform.prometheusRule.costBudget.enabled=true)"
          grep -q 'kind: PrometheusRule' <<< "$llm_rules"
          grep -q 'ClusterRcaLlmHighLatency' <<< "$llm_rules"
          grep -q 'ClusterRcaLlmHighErrorRate' <<< "$llm_rules"
          grep -q 'ClusterRcaLlmUsageMetadataMissing' <<< "$llm_rules"
          grep -q 'ClusterRcaLlmCircuitBreakerOpen' <<< "$llm_rules"
          grep -q 'ClusterRcaLlmEstimatedCostBudgetExceeded' <<< "$llm_rules"
          alertmanager_delivery="$(helm template rca charts/cluster-infra-rca-platform \
            --show-only templates/platform-alertmanagerconfig.yaml \
            --set platform.alertmanagerConfig.enabled=true \
            --set-string platform.alertmanagerConfig.clusterId=delivery-test \
            --set-string platform.alertmanagerConfig.labels.release=monitoring \
            --set-string platform.secret.webhookToken=delivery-test-token)"
          grep -q 'kind: AlertmanagerConfig' <<< "$alertmanager_delivery"
          grep -q '/api/webhooks/alertmanager' <<< "$alertmanager_delivery"
          grep -q 'authorization:' <<< "$alertmanager_delivery"
          grep -q 'RCA_WEBHOOK_TOKEN' <<< "$alertmanager_delivery"
          reviewer="$(helm template rca charts/cluster-infra-rca-platform \
            --set platform.kubernetesReviewer.enabled=true)"
          grep -q 'resources: \["tokenreviews"\]' <<< "${reviewer}"
          grep -q 'resources: \["pods"\]' <<< "${reviewer}"
          grep -q 'name: kubernetes-reviewer-token' <<< "${reviewer}"
      - name: Evaluate rendered LLM alert rules
        run: python3 scripts/llm_prometheus_rule_test.py --helm helm --promtool promtool
      - name: Test Prometheus Alertmanager webhook delivery
        run: python3 scripts/alertmanager_delivery_test.py --helm helm --prometheus prometheus --alertmanager alertmanager
      - name: Render Agent chart variants
        run: |
          helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set secret.create=true \
            --set secret.clusterId=cluster-test \
            --set secret.agentToken=agent-token > /dev/null
          helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set tls.enabled=true \
            --set tls.existingSecret=agent-mtls \
            --set secret.existingSecret.name=agent-auth > /dev/null
          helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set mode=ebpf \
            --set ebpf.enabled=true \
            --set secret.existingSecret.name=agent-auth > /dev/null
          token_review="$(helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set secret.create=true \
            --set secret.clusterId=cluster-token-review \
            --set clusterId=cluster-token-review \
            --set enrollment.mode=kubernetes-token-review \
            --set-string enrollment.audience=https://kubernetes.default.svc)"
          grep -q 'name: AGENT_ENROLLMENT_MODE' <<< "${token_review}"
          grep -q 'value: "kubernetes-token-review"' <<< "${token_review}"
          grep -q 'name: AGENT_IDENTITY_TOKEN_PATH' <<< "${token_review}"
          grep -q 'serviceAccountToken:' <<< "${token_review}"
          grep -q 'audience: "https://kubernetes.default.svc"' <<< "${token_review}"
          grep -q 'cluster-infra-rca.io/cluster-id: "cluster-token-review"' <<< "${token_review}"
          grep -q 'resources: \["daemonsets"\]' <<< "${token_review}"
          if grep -q 'resources: \["tokenreviews"\]' <<< "${token_review}"; then
            echo "Agent RBAC must not create TokenReview requests" >&2
            exit 1
          fi
          if grep -q 'agent-token:' <<< "${token_review}"; then
            echo "TokenReview enrollment must not render a bootstrap token Secret key" >&2
            exit 1
          fi
          eks_auto="$(helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set mode=safe \
            --set statePersistence.enabled=false \
            --set secret.existingSecret.name=agent-auth \
            --set-string 'nodeSelector.eks\.amazonaws\.com/compute-type=auto')"
          grep -q 'hostNetwork: false' <<< "${eks_auto}"
          grep -q 'hostPID: false' <<< "${eks_auto}"
          if grep -q 'hostPath:' <<< "${eks_auto}"; then
            echo "EKS Auto Mode safe canary must not render hostPath volumes" >&2
            exit 1
          fi
          eks_managed="$(helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set mode=node-diagnostics \
            --set statePersistence.enabled=false \
            --set secret.existingSecret.name=agent-auth \
            --set-string 'nodeSelector.eks\.amazonaws\.com/nodegroup=fixture-workers')"
          grep -q 'hostNetwork: true' <<< "${eks_managed}"
          grep -q 'hostPID: true' <<< "${eks_managed}"
          grep -q 'path: "/var/log"' <<< "${eks_managed}"
          grep -q 'readOnly: true' <<< "${eks_managed}"
          aks_nap="$(helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set mode=safe \
            --set statePersistence.enabled=false \
            --set secret.existingSecret.name=agent-auth \
            --set-string 'nodeSelector.karpenter\.sh/nodepool=fixture-workers')"
          grep -q 'kubernetes.io/os: linux' <<< "${aks_nap}"
          grep -q 'karpenter.sh/nodepool: fixture-workers' <<< "${aks_nap}"
          grep -q 'hostNetwork: false' <<< "${aks_nap}"
          grep -q 'hostPID: false' <<< "${aks_nap}"
          if grep -q 'hostPath:' <<< "${aks_nap}"; then
            echo "AKS node auto-provisioning safe canary must not render hostPath volumes" >&2
            exit 1
          fi
          aks_system="$(helm template rca-agent charts/cluster-infra-rca-agent \
            --set backendUrl=https://rca.example.com \
            --set mode=node-diagnostics \
            --set statePersistence.enabled=false \
            --set secret.existingSecret.name=agent-auth \
            --set-string 'nodeSelector.kubernetes\.azure\.com/mode=system')"
          grep -q 'kubernetes.io/os: linux' <<< "${aks_system}"
          grep -q 'kubernetes.azure.com/mode: system' <<< "${aks_system}"
          grep -q 'hostNetwork: true' <<< "${aks_system}"
          grep -q 'hostPID: true' <<< "${aks_system}"
          grep -q 'path: "/var/log"' <<< "${aks_system}"
          grep -q 'readOnly: true' <<< "${aks_system}"
      - name: Verify Agent manifest parity contract
        run: python3 scripts/agent-manifest-parity.py --helm helm

  prometheus-operator-delivery-e2e:
    needs: helm-validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_VERSION: 0.32.0
      KIND_LINUX_AMD64_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
      KIND_NODE_IMAGE: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
      KUBECTL_VERSION: 1.35.5
      KUBECTL_LINUX_AMD64_SHA256: 90f75ea6ecc9ea5633262e1c0b83a40560003b30fc94a04cb099404fcef0c224
      KUBE_PROMETHEUS_STACK_VERSION: 87.17.0
      KIND_CLUSTER_NAME: rca-monitoring
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Install pinned Kubernetes tools
        run: |
          set -euo pipefail
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_LINUX_AMD64_SHA256}  kind" | sha256sum --check
          sudo install kind /usr/local/bin/kind
          curl -fsSLo kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_LINUX_AMD64_SHA256}  kubectl" | sha256sum --check
          sudo install kubectl /usr/local/bin/kubectl
      - name: Create monitoring cluster
        run: kind create cluster --name "${KIND_CLUSTER_NAME}" --image "${KIND_NODE_IMAGE}" --wait 180s
      - name: Install pinned Prometheus Operator stack
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version "${KUBE_PROMETHEUS_STACK_VERSION}" \
            --namespace monitoring \
            --create-namespace \
            --set defaultRules.create=false \
            --set grafana.enabled=false \
            --set kubeStateMetrics.enabled=false \
            --set nodeExporter.enabled=false \
            --set prometheus.prometheusSpec.ruleSelectorNilUsesHelmValues=false \
            --set prometheus.prometheusSpec.evaluationInterval=1s \
            --wait \
            --timeout 10m
      - name: Verify Operator Alertmanager delivery
        run: |
          context="$(kubectl config current-context)"
          bash scripts/prometheus-operator-delivery-e2e.sh \
            --apply \
            --confirm-context "${context}" \
            --selector-label release=monitoring \
            --timeout 300
      - name: Upload Operator delivery diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prometheus-operator-delivery-e2e
          path: validation-results/prometheus-operator-delivery
          if-no-files-found: ignore
          retention-days: 14
      - name: Delete monitoring cluster
        if: always()
        run: kind delete cluster --name "${KIND_CLUSTER_NAME}"

  release-readiness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile operational scripts
        run: |
          python -m py_compile \
            scripts/release-readiness-check.py \
            scripts/verify-api-contract.py \
            scripts/verify-blind-evaluation-corpus.py \
            scripts/verify-managed-blind-workflow.py \
            scripts/managed_blind_common.py \
            scripts/managed-blind-intake.py \
            scripts/managed-blind-finalize.py \
            scripts/verify-container-pinning.py \
            scripts/verify-build-lifecycle.py \
            scripts/verify-operational-catalog.py \
            scripts/verify-supply-chain-workflows.py \
            scripts/verify_database_compatibility_report.py \
            scripts/daemonset_operational_check.py \
            scripts/operational_scenario_validation.py \
            scripts/llm_prometheus_rule_test.py \
            scripts/llm-staging-smoke.py \
            scripts/agent-soak-validation.py \
            scripts/agent-soak-revalidate.py \
            scripts/agent-soak-comparison.py \
            scripts/managed-platform-contract-check.py
      - name: Validate API security contract
        run: python scripts/verify-api-contract.py
      - name: Validate blind evaluation corpus separation
        run: python scripts/verify-blind-evaluation-corpus.py
      - name: Validate managed blind evaluation workflow
        run: python scripts/verify-managed-blind-workflow.py
      - name: Validate container pinning
        run: python scripts/verify-container-pinning.py
      - name: Validate Maven and Frontend lifecycle separation
        run: python scripts/verify-build-lifecycle.py
      - name: Validate operational catalog
        run: python scripts/verify-operational-catalog.py
      - name: Validate managed platform contract fixtures
        run: python scripts/managed-platform-contract-check.py
      - name: Validate supply-chain workflows
        run: python scripts/verify-supply-chain-workflows.py
      - name: Validate release readiness contracts
        run: python scripts/release-readiness-check.py

  docker-build:
    needs:
      - node-agent-test
      - frontend-build
      - web-console-test
      - console-workflow-e2e
      - helm-validate
      - release-readiness-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - component: platform
            dockerfile: Dockerfile.web-console
          - component: agent
            dockerfile: Dockerfile.agent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: cluster-infra-rca-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  agent-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate collector on common Linux distributions
        run: bash scripts/validate-agent-distributions.sh

  database-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate PostgreSQL and MariaDB restore
        run: bash scripts/validate-database-backup.sh

  kind-smoke:
    needs:
      - helm-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: rca-smoke
          config: config/kind-multi-node.yaml
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Run Kubernetes end-to-end smoke test
        run: bash scripts/kind-smoke.sh
      - name: Upload Agent fleet runtime smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kind-agent-fleet-runtime
          path: validation-results/kind-agent-runtime
          if-no-files-found: ignore
          retention-days: 14
