name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  sbom-and-grype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create Syft SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: cluster-infra-rca-platform-sbom.spdx.json
      - name: Scan SBOM with Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          sbom: cluster-infra-rca-platform-sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  codeql:
    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin
          - python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: web-console/pom.xml
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build Java
        if: matrix.language == 'java-kotlin'
        working-directory: web-console
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - uses: github/codeql-action/analyze@v3
