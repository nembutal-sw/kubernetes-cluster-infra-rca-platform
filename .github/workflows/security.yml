name: Security

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

env:
  SECURITY_REPORT_SEVERITIES: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  SECURITY_BLOCKING_SEVERITIES: HIGH,CRITICAL

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: ${{ env.SECURITY_REPORT_SEVERITIES }}
          ignore-unfixed: true
          exit-code: "0"
      - name: Gate filesystem vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: ${{ env.SECURITY_BLOCKING_SEVERITIES }}
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
      - name: Upload filesystem scan report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-filesystem-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 14

  sbom-and-grype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create Syft SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: cluster-infra-rca-platform-sbom.spdx.json
          upload-artifact: false
      - name: Upload repository SBOM
        uses: actions/upload-artifact@v7
        with:
          name: repository-sbom-spdx
          path: cluster-infra-rca-platform-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Scan repository with Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-repository-sbom
      - name: Upload Grype scan report
        uses: actions/upload-artifact@v7
        if: always() && steps.grype.outputs.sarif != ''
        with:
          name: grype-repository-sarif
          path: ${{ steps.grype.outputs.sarif }}
          if-no-files-found: ignore
          retention-days: 14

  image-sbom-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: platform
            dockerfile: Dockerfile.web-console
            image: cluster-infra-rca-platform
          - component: agent
            dockerfile: Dockerfile.agent
            image: cluster-infra-rca-agent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build ${{ matrix.component }} image for scanning
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:security-${{ github.sha }}
          cache-from: type=gha,scope=security-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=security-${{ matrix.component }}
      - name: Create ${{ matrix.component }} image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ matrix.image }}:security-${{ github.sha }}
          format: spdx-json
          output-file: ${{ matrix.component }}-image-sbom.spdx.json
          upload-artifact: false
      - name: Create ${{ matrix.component }} image Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:security-${{ github.sha }}
          format: sarif
          output: ${{ matrix.component }}-image-trivy.sarif
          severity: ${{ env.SECURITY_REPORT_SEVERITIES }}
          ignore-unfixed: true
          exit-code: "0"
      - name: Gate ${{ matrix.component }} image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:security-${{ github.sha }}
          format: table
          severity: ${{ env.SECURITY_BLOCKING_SEVERITIES }}
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload ${{ matrix.component }} image SARIF
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: ${{ matrix.component }}-image-trivy.sarif
          category: trivy-image-${{ matrix.component }}
      - name: Upload ${{ matrix.component }} image security artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.component }}-image-security
          path: |
            ${{ matrix.component }}-image-sbom.spdx.json
            ${{ matrix.component }}-image-trivy.sarif
          if-no-files-found: ignore
          retention-days: 30

  codeql:
    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin
          - python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: web-console/pom.xml
      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build Java
        if: matrix.language == 'java-kotlin'
        working-directory: web-console
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - uses: github/codeql-action/analyze@v4.37.4
