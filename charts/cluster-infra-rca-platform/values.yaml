nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

database:
  enabled: true
  type: postgresql
  image:
    postgresql:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    mariadb:
      repository: mariadb
      tag: "11.4"
      pullPolicy: IfNotPresent
  auth:
    database: rca
    username: rca
    password: change-me
    rootPassword: change-me-root
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ""
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

platform:
  replicaCount: 1
  revisionHistoryLimit: 3
  terminationGracePeriodSeconds: 30
  serviceAccount:
    create: true
    name: ""
    automountServiceAccountToken: false
  image:
    repository: ghcr.io/example/cluster-infra-rca-web-console
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    metricsTokenSecretName: ""
    metricsTokenSecretKey: RCA_METRICS_TOKEN
  config:
    springProfiles: ""
    publicApiBaseUrl: ""
    sessionTtlHours: 12
    agentOfflineAfterSeconds: 180
    agentExpectedVersion: ""
    agentMinimumSupportedVersion: "0.1.0"
    agentProtocolVersion: "1"
    agentMinimumSupportedProtocolVersion: "1"
    platformVersion: "0.1.0"
    monitoringEnabled: false
    monitoringIntervalMs: 60000
    observabilityEnabled: true
    observabilityRefreshIntervalMs: 15000
    observabilityInitialDelayMs: 5000
    llmEnabled: false
    llmProvider: none
    llmModel: ""
    springAiChatModel: none
    llmTimeoutSeconds: 30
    llmMaxAttempts: 2
    llmFailureThreshold: 3
    llmCooldownSeconds: 60
    incidentCorrelationWindowMinutes: 15
    auditEnabled: true
    auditRetentionDays: 180
    maintenanceEnabled: true
    maintenanceCron: "0 17 3 * * *"
    maintenanceBatchSize: 250
    evidenceRetentionDays: 30
    evidenceRequestRetentionDays: 30
    analysisTaskRetentionDays: 30
    realtimeEventRetentionDays: 14
    reportRetentionDays: 365
    demoEnabled: false
    exportMaxBundleBytes: 10485760
    notificationEnabled: false
    notificationMinimumSeverity: critical
    notificationMaxAttempts: 2
    notificationTimeoutSeconds: 5
    pipelineEnabled: true
    pipelineBatchSize: 4
    pipelinePollIntervalMs: 2000
    pipelineInitialDelayMs: 3000
    pipelineLeaseSeconds: 300
    pipelineMaxAttempts: 5
    pipelineRetryBaseSeconds: 5
    pipelineRetryMaxSeconds: 300
  secret:
    create: true
    existingSecret: ""
    jdbcUrl: ""
    databaseUsername: ""
    databasePassword: ""
    defaultAdminUsername: admin
    defaultAdminPassword: admin
    webhookToken: dev-webhook-token
    metricsToken: ""
    encryptionSecret: ""
    slackWebhookUrl: ""
    openaiApiKey: ""
    anthropicApiKey: ""
    geminiApiKey: ""
    ollamaBaseUrl: ""
  externalSecret:
    enabled: false
    targetName: ""
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: ""
    data: []
  env: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  readinessProbe:
    path: /health/ready
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  startupProbe:
    path: /health
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
  networkPolicy:
    enabled: false
    ingressFrom: []

backup:
  enabled: false
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  retentionDays: 14
  persistence:
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  platform:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: rca.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
