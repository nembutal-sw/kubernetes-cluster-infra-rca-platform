nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

database:
  enabled: true
  type: postgresql
  image:
    postgresql:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    mariadb:
      repository: mariadb
      tag: "11.4"
      pullPolicy: IfNotPresent
  auth:
    database: rca
    username: rca
    password: change-me
    rootPassword: change-me-root
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

platform:
  replicaCount: 1
  image:
    repository: ghcr.io/example/cluster-infra-rca-web-console
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  config:
    publicApiBaseUrl: ""
    sessionTtlHours: 12
    agentOfflineAfterSeconds: 180
    monitoringEnabled: false
    monitoringIntervalMs: 60000
    llmEnabled: false
    llmProvider: none
    llmModel: ""
    springAiChatModel: none
  secret:
    create: true
    existingSecret: ""
    jdbcUrl: ""
    databaseUsername: ""
    databasePassword: ""
    defaultAdminUsername: admin
    defaultAdminPassword: admin
    webhookToken: dev-webhook-token
    openaiApiKey: ""
    anthropicApiKey: ""
    geminiApiKey: ""
    ollamaBaseUrl: ""
  env: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  readinessProbe:
    path: /health/ready
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  platform:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: rca.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
