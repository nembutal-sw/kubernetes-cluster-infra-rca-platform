{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-infra-rca-platform.databaseServiceName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: db
      port: {{ include "cluster-infra-rca-platform.databasePort" . }}
      targetPort: db
  selector:
    {{- include "cluster-infra-rca-platform.databaseSelectorLabels" . | nindent 4 }}
{{- end }}
