{{- if .Values.platform.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cluster-infra-rca-platform.platformName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.platform.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ required "platform.externalSecret.secretStoreRef.kind is required" .Values.platform.externalSecret.secretStoreRef.kind }}
    name: {{ required "platform.externalSecret.secretStoreRef.name is required" .Values.platform.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "cluster-infra-rca-platform.secretName" . }}
    creationPolicy: Owner
  data:
    {{- required "platform.externalSecret.data is required" .Values.platform.externalSecret.data | toYaml | nindent 4 }}
{{- end }}
