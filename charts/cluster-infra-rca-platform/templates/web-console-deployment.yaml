apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-infra-rca-platform.webConsoleName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-console
spec:
  replicas: {{ .Values.webConsole.replicaCount }}
  selector:
    matchLabels:
      {{- include "cluster-infra-rca-platform.webConsoleSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cluster-infra-rca-platform.webConsoleSelectorLabels" . | nindent 8 }}
        {{- with .Values.webConsole.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.webConsole.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webConsole.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web-console
          image: "{{ .Values.webConsole.image.repository }}:{{ .Values.webConsole.image.tag }}"
          imagePullPolicy: {{ .Values.webConsole.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RCA_API_BASE_URL
              value: {{ include "cluster-infra-rca-platform.backendUrl" . | quote }}
            - name: RCA_PUBLIC_API_BASE_URL
              value: {{ .Values.webConsole.config.publicApiBaseUrl | quote }}
            {{- range $key, $value := .Values.webConsole.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.webConsole.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.webConsole.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.webConsole.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.webConsole.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.webConsole.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.webConsole.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.webConsole.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.webConsole.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.webConsole.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.webConsole.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.webConsole.livenessProbe.failureThreshold }}
          {{- with .Values.webConsole.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.webConsole.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webConsole.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webConsole.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
