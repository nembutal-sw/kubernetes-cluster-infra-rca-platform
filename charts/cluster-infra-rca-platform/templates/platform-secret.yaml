{{- if and .Values.platform.secret.create (not .Values.platform.externalSecret.enabled) }}
{{- if or (contains "prod" (lower .Values.platform.config.springProfiles)) (contains "production" (lower .Values.platform.config.springProfiles)) }}
{{- $_ := required "platform.secret.defaultAdminUsername is required for production" .Values.platform.secret.defaultAdminUsername }}
{{- $_ := required "platform.secret.defaultAdminPassword is required for production" .Values.platform.secret.defaultAdminPassword }}
{{- $_ := required "platform.secret.webhookToken is required for production" .Values.platform.secret.webhookToken }}
{{- end }}
{{- if .Values.platform.config.gitopsEnabled }}
{{- $_ := required "platform.config.gitopsRepository is required when GitOps is enabled" .Values.platform.config.gitopsRepository }}
{{- $_ := required "platform.secret.gitopsToken is required when GitOps is enabled" .Values.platform.secret.gitopsToken }}
{{- $_ := required "platform.secret.gitopsWebhookSecret is required when GitOps is enabled" .Values.platform.secret.gitopsWebhookSecret }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-infra-rca-platform.secretName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
type: Opaque
stringData:
  RCA_JDBC_URL: {{ include "cluster-infra-rca-platform.jdbcUrl" . | quote }}
  RCA_DB_USERNAME: {{ include "cluster-infra-rca-platform.databaseUsername" . | quote }}
  RCA_DB_PASSWORD: {{ include "cluster-infra-rca-platform.databasePassword" . | quote }}
  RCA_DEFAULT_ADMIN_USERNAME: {{ .Values.platform.secret.defaultAdminUsername | quote }}
  RCA_DEFAULT_ADMIN_PASSWORD: {{ .Values.platform.secret.defaultAdminPassword | quote }}
  RCA_WEBHOOK_TOKEN: {{ .Values.platform.secret.webhookToken | quote }}
  RCA_METRICS_TOKEN: {{ .Values.platform.secret.metricsToken | quote }}
  RCA_ENCRYPTION_SECRET: {{ .Values.platform.secret.encryptionSecret | quote }}
  RCA_OPAQUE_TOKEN_PEPPER: {{ .Values.platform.secret.opaqueTokenPepper | quote }}
  RCA_EXPORT_SIGNATURE_SECRET: {{ .Values.platform.secret.exportSignatureSecret | quote }}
  RCA_SLACK_WEBHOOK_URL: {{ .Values.platform.secret.slackWebhookUrl | quote }}
  RCA_NOTIFICATION_WEBHOOK_URL: {{ .Values.platform.secret.notificationWebhookUrl | quote }}
  RCA_NOTIFICATION_WEBHOOK_TOKEN: {{ .Values.platform.secret.notificationWebhookToken | quote }}
  RCA_GITOPS_TOKEN: {{ .Values.platform.secret.gitopsToken | quote }}
  RCA_GITOPS_WEBHOOK_SECRET: {{ .Values.platform.secret.gitopsWebhookSecret | quote }}
  {{- with .Values.platform.secret.openaiApiKey }}
  SPRING_AI_OPENAI_SDK_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.platform.secret.openaiBaseUrl }}
  SPRING_AI_OPENAI_SDK_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.platform.secret.anthropicApiKey }}
  SPRING_AI_ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.platform.secret.geminiApiKey }}
  SPRING_AI_GOOGLE_GENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.platform.secret.ollamaBaseUrl }}
  SPRING_AI_OLLAMA_BASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
