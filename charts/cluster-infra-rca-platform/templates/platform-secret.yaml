{{- if .Values.platform.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-infra-rca-platform.secretName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
type: Opaque
stringData:
  RCA_JDBC_URL: {{ include "cluster-infra-rca-platform.jdbcUrl" . | quote }}
  RCA_DB_USERNAME: {{ include "cluster-infra-rca-platform.databaseUsername" . | quote }}
  RCA_DB_PASSWORD: {{ include "cluster-infra-rca-platform.databasePassword" . | quote }}
  RCA_DEFAULT_ADMIN_USERNAME: {{ .Values.platform.secret.defaultAdminUsername | quote }}
  RCA_DEFAULT_ADMIN_PASSWORD: {{ .Values.platform.secret.defaultAdminPassword | quote }}
  RCA_WEBHOOK_TOKEN: {{ .Values.platform.secret.webhookToken | quote }}
  SPRING_AI_OPENAI_SDK_API_KEY: {{ .Values.platform.secret.openaiApiKey | quote }}
  SPRING_AI_ANTHROPIC_API_KEY: {{ .Values.platform.secret.anthropicApiKey | quote }}
  SPRING_AI_GOOGLE_GENAI_API_KEY: {{ .Values.platform.secret.geminiApiKey | quote }}
  SPRING_AI_OLLAMA_BASE_URL: {{ .Values.platform.secret.ollamaBaseUrl | quote }}
{{- end }}
