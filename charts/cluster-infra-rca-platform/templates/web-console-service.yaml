apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-infra-rca-platform.webConsoleName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-console
spec:
  type: {{ .Values.webConsole.service.type }}
  ports:
    - name: http
      port: {{ .Values.webConsole.service.port }}
      targetPort: http
  selector:
    {{- include "cluster-infra-rca-platform.webConsoleSelectorLabels" . | nindent 4 }}
