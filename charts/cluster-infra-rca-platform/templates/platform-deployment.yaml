apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-infra-rca-platform.platformName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  replicas: {{ .Values.platform.replicaCount }}
  revisionHistoryLimit: {{ .Values.platform.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "cluster-infra-rca-platform.platformSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cluster-infra-rca-platform.platformSelectorLabels" . | nindent 8 }}
        {{- with .Values.platform.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.platform.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cluster-infra-rca-platform.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.platform.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.platform.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.platform.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: platform
          image: "{{ .Values.platform.image.repository }}:{{ .Values.platform.image.tag }}"
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "cluster-infra-rca-platform.secretName" . }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.platform.config.springProfiles | quote }}
            - name: RCA_PUBLIC_API_BASE_URL
              value: {{ .Values.platform.config.publicApiBaseUrl | quote }}
            - name: RCA_SESSION_TTL_HOURS
              value: {{ .Values.platform.config.sessionTtlHours | quote }}
            - name: RCA_STANDARD_REQUEST_MAX_BYTES
              value: {{ include "cluster-infra-rca-platform.integerEnv" .Values.platform.config.standardRequestMaxBytes | quote }}
            - name: RCA_EVIDENCE_REQUEST_MAX_BYTES
              value: {{ include "cluster-infra-rca-platform.integerEnv" .Values.platform.config.evidenceRequestMaxBytes | quote }}
            - name: RCA_MANIFEST_TOKEN_TTL_SECONDS
              value: {{ .Values.platform.config.manifestTokenTtlSeconds | quote }}
            - name: RCA_AGENT_MTLS_REQUIRED
              value: {{ .Values.platform.config.agentMtlsRequired | quote }}
            - name: RCA_AGENT_OFFLINE_AFTER_SECONDS
              value: {{ .Values.platform.config.agentOfflineAfterSeconds | quote }}
            - name: RCA_AGENT_EXPECTED_VERSION
              value: {{ .Values.platform.config.agentExpectedVersion | quote }}
            - name: RCA_AGENT_MINIMUM_SUPPORTED_VERSION
              value: {{ .Values.platform.config.agentMinimumSupportedVersion | quote }}
            - name: RCA_AGENT_PROTOCOL_VERSION
              value: {{ .Values.platform.config.agentProtocolVersion | quote }}
            - name: RCA_AGENT_MINIMUM_SUPPORTED_PROTOCOL_VERSION
              value: {{ .Values.platform.config.agentMinimumSupportedProtocolVersion | quote }}
            - name: RCA_PLATFORM_VERSION
              value: {{ .Values.platform.config.platformVersion | quote }}
            - name: RCA_MONITORING_ENABLED
              value: {{ .Values.platform.config.monitoringEnabled | quote }}
            - name: RCA_MONITORING_INTERVAL_MS
              value: {{ .Values.platform.config.monitoringIntervalMs | quote }}
            - name: RCA_OBSERVABILITY_ENABLED
              value: {{ .Values.platform.config.observabilityEnabled | quote }}
            - name: RCA_OBSERVABILITY_REFRESH_INTERVAL_MS
              value: {{ .Values.platform.config.observabilityRefreshIntervalMs | quote }}
            - name: RCA_OBSERVABILITY_INITIAL_DELAY_MS
              value: {{ .Values.platform.config.observabilityInitialDelayMs | quote }}
            - name: RCA_LLM_ENABLED
              value: {{ .Values.platform.config.llmEnabled | quote }}
            - name: RCA_LLM_PROVIDER
              value: {{ .Values.platform.config.llmProvider | quote }}
            - name: RCA_LLM_MODEL
              value: {{ .Values.platform.config.llmModel | quote }}
            - name: RCA_SPRING_AI_CHAT_MODEL
              value: {{ .Values.platform.config.springAiChatModel | quote }}
            - name: RCA_LLM_TIMEOUT_SECONDS
              value: {{ .Values.platform.config.llmTimeoutSeconds | quote }}
            - name: RCA_LLM_MAX_OUTPUT_TOKENS
              value: {{ .Values.platform.config.llmMaxOutputTokens | quote }}
            - name: RCA_LLM_MAX_ATTEMPTS
              value: {{ .Values.platform.config.llmMaxAttempts | quote }}
            - name: RCA_LLM_FAILURE_THRESHOLD
              value: {{ .Values.platform.config.llmFailureThreshold | quote }}
            - name: RCA_LLM_COOLDOWN_SECONDS
              value: {{ .Values.platform.config.llmCooldownSeconds | quote }}
            - name: RCA_INCIDENT_CORRELATION_WINDOW_MINUTES
              value: {{ .Values.platform.config.incidentCorrelationWindowMinutes | quote }}
            - name: RCA_INCIDENT_CORRELATION_MINIMUM_SCORE
              value: {{ .Values.platform.config.incidentCorrelationMinimumScore | quote }}
            - name: RCA_INCIDENT_CORRELATION_CANDIDATE_LIMIT
              value: {{ .Values.platform.config.incidentCorrelationCandidateLimit | quote }}
            - name: RCA_INCIDENT_AUTO_RESOLVE_ENABLED
              value: {{ .Values.platform.config.incidentAutoResolveEnabled | quote }}
            - name: RCA_INCIDENT_INACTIVITY_MINUTES
              value: {{ .Values.platform.config.incidentInactivityMinutes | quote }}
            - name: RCA_INCIDENT_LIFECYCLE_SCAN_INTERVAL_MS
              value: {{ .Values.platform.config.incidentLifecycleScanIntervalMs | quote }}
            - name: RCA_INCIDENT_LIFECYCLE_INITIAL_DELAY_MS
              value: {{ .Values.platform.config.incidentLifecycleInitialDelayMs | quote }}
            - name: RCA_INCIDENT_LIFECYCLE_BATCH_SIZE
              value: {{ .Values.platform.config.incidentLifecycleBatchSize | quote }}
            - name: RCA_INCIDENT_RECURRENCE_LOOKBACK_HOURS
              value: {{ .Values.platform.config.incidentRecurrenceLookbackHours | quote }}
            - name: RCA_TOPOLOGY_ENABLED
              value: {{ .Values.platform.config.topologyEnabled | quote }}
            - name: RCA_TOPOLOGY_LOOKBACK_HOURS
              value: {{ .Values.platform.config.topologyLookbackHours | quote }}
            - name: RCA_TOPOLOGY_OBSERVATION_LIMIT
              value: {{ .Values.platform.config.topologyObservationLimit | quote }}
            - name: RCA_AUDIT_ENABLED
              value: {{ .Values.platform.config.auditEnabled | quote }}
            - name: RCA_AUDIT_RETENTION_DAYS
              value: {{ .Values.platform.config.auditRetentionDays | quote }}
            - name: RCA_MAINTENANCE_ENABLED
              value: {{ .Values.platform.config.maintenanceEnabled | quote }}
            - name: RCA_MAINTENANCE_CRON
              value: {{ .Values.platform.config.maintenanceCron | quote }}
            - name: RCA_MAINTENANCE_BATCH_SIZE
              value: {{ .Values.platform.config.maintenanceBatchSize | quote }}
            - name: RCA_EVIDENCE_RETENTION_DAYS
              value: {{ .Values.platform.config.evidenceRetentionDays | quote }}
            - name: RCA_EVIDENCE_REQUEST_RETENTION_DAYS
              value: {{ .Values.platform.config.evidenceRequestRetentionDays | quote }}
            - name: RCA_ANALYSIS_TASK_RETENTION_DAYS
              value: {{ .Values.platform.config.analysisTaskRetentionDays | quote }}
            - name: RCA_REALTIME_EVENT_RETENTION_DAYS
              value: {{ .Values.platform.config.realtimeEventRetentionDays | quote }}
            - name: RCA_TOPOLOGY_OBSERVATION_RETENTION_DAYS
              value: {{ .Values.platform.config.topologyObservationRetentionDays | quote }}
            - name: RCA_REPORT_RETENTION_DAYS
              value: {{ .Values.platform.config.reportRetentionDays | quote }}
            - name: RCA_DEMO_ENABLED
              value: {{ .Values.platform.config.demoEnabled | quote }}
            - name: RCA_EXPORT_MAX_BUNDLE_BYTES
              value: {{ include "cluster-infra-rca-platform.integerEnv" .Values.platform.config.exportMaxBundleBytes | quote }}
            - name: RCA_EXPORT_SIGNATURE_KEY_ID
              value: {{ .Values.platform.config.exportSignatureKeyId | quote }}
            - name: RCA_NOTIFICATION_ENABLED
              value: {{ .Values.platform.config.notificationEnabled | quote }}
            - name: RCA_NOTIFICATION_MINIMUM_SEVERITY
              value: {{ .Values.platform.config.notificationMinimumSeverity | quote }}
            - name: RCA_NOTIFICATION_MAX_ATTEMPTS
              value: {{ .Values.platform.config.notificationMaxAttempts | quote }}
            - name: RCA_NOTIFICATION_TIMEOUT_SECONDS
              value: {{ .Values.platform.config.notificationTimeoutSeconds | quote }}
            - name: RCA_PIPELINE_ENABLED
              value: {{ .Values.platform.config.pipelineEnabled | quote }}
            - name: RCA_PIPELINE_BATCH_SIZE
              value: {{ .Values.platform.config.pipelineBatchSize | quote }}
            - name: RCA_PIPELINE_POLL_INTERVAL_MS
              value: {{ .Values.platform.config.pipelinePollIntervalMs | quote }}
            - name: RCA_PIPELINE_INITIAL_DELAY_MS
              value: {{ .Values.platform.config.pipelineInitialDelayMs | quote }}
            - name: RCA_PIPELINE_LEASE_SECONDS
              value: {{ .Values.platform.config.pipelineLeaseSeconds | quote }}
            - name: RCA_PIPELINE_MAX_ATTEMPTS
              value: {{ .Values.platform.config.pipelineMaxAttempts | quote }}
            - name: RCA_PIPELINE_RETRY_BASE_SECONDS
              value: {{ .Values.platform.config.pipelineRetryBaseSeconds | quote }}
            - name: RCA_PIPELINE_RETRY_MAX_SECONDS
              value: {{ .Values.platform.config.pipelineRetryMaxSeconds | quote }}
            - name: RCA_THRESHOLD_DISK_WARNING_PERCENT
              value: {{ default 85 .Values.platform.config.thresholdDiskWarningPercent | quote }}
            - name: RCA_THRESHOLD_DISK_CRITICAL_PERCENT
              value: {{ default 90 .Values.platform.config.thresholdDiskCriticalPercent | quote }}
            - name: RCA_THRESHOLD_INODE_WARNING_PERCENT
              value: {{ default 85 .Values.platform.config.thresholdInodeWarningPercent | quote }}
            - name: RCA_THRESHOLD_INODE_CRITICAL_PERCENT
              value: {{ default 90 .Values.platform.config.thresholdInodeCriticalPercent | quote }}
            - name: RCA_THRESHOLD_MEMORY_CRITICAL_PERCENT
              value: {{ default 90 .Values.platform.config.thresholdMemoryCriticalPercent | quote }}
            - name: RCA_THRESHOLD_PID_WARNING_PERCENT
              value: {{ default 85 .Values.platform.config.thresholdPidWarningPercent | quote }}
            - name: RCA_THRESHOLD_PID_CRITICAL_PERCENT
              value: {{ default 95 .Values.platform.config.thresholdPidCriticalPercent | quote }}
            - name: RCA_THRESHOLD_CONNTRACK_WARNING_PERCENT
              value: {{ default 80 .Values.platform.config.thresholdConntrackWarningPercent | quote }}
            - name: RCA_THRESHOLD_CONNTRACK_CRITICAL_PERCENT
              value: {{ default 95 .Values.platform.config.thresholdConntrackCriticalPercent | quote }}
            - name: RCA_THRESHOLD_DISK_AWAIT_WARNING_MS
              value: {{ default 20 .Values.platform.config.thresholdDiskAwaitWarningMs | quote }}
            - name: RCA_THRESHOLD_DNS_LATENCY_WARNING_MS
              value: {{ default 500 .Values.platform.config.thresholdDnsLatencyWarningMs | quote }}
            - name: RCA_THRESHOLD_API_SERVER_LATENCY_WARNING_MS
              value: {{ default 1000 .Values.platform.config.thresholdApiServerLatencyWarningMs | quote }}
            - name: RCA_THRESHOLD_ETCD_LATENCY_WARNING_MS
              value: {{ default 500 .Values.platform.config.thresholdEtcdLatencyWarningMs | quote }}
            - name: SERVER_SHUTDOWN
              value: graceful
            {{- range $key, $value := .Values.platform.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.platform.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.platform.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.platform.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.platform.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.platform.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.platform.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.platform.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.platform.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.platform.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.platform.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.platform.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.platform.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.platform.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.platform.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.platform.livenessProbe.failureThreshold }}
          {{- with .Values.platform.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.platform.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.platform.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.platform.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.platform.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
