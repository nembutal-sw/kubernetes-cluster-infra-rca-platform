{{- if .Values.backend.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-infra-rca-platform.secretName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  RCA_DATABASE_URL: {{ include "cluster-infra-rca-platform.databaseUrl" . | quote }}
  RCA_DEFAULT_ADMIN_USERNAME: {{ .Values.backend.secret.defaultAdminUsername | quote }}
  RCA_DEFAULT_ADMIN_PASSWORD: {{ .Values.backend.secret.defaultAdminPassword | quote }}
  RCA_WEBHOOK_TOKEN: {{ .Values.backend.secret.webhookToken | quote }}
  {{- $llmApiKey := coalesce .Values.backend.secret.llmApiKey .Values.backend.secret.openaiApiKey .Values.backend.secret.anthropicApiKey .Values.backend.secret.geminiApiKey }}
  {{- with $llmApiKey }}
  RCA_LLM_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
