{{- if .Values.backend.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-infra-rca-platform.secretName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  RCA_DATABASE_URL: {{ .Values.backend.secret.databaseUrl | quote }}
  RCA_DEFAULT_ADMIN_USERNAME: {{ .Values.backend.secret.defaultAdminUsername | quote }}
  RCA_DEFAULT_ADMIN_PASSWORD: {{ .Values.backend.secret.defaultAdminPassword | quote }}
  RCA_WEBHOOK_TOKEN: {{ .Values.backend.secret.webhookToken | quote }}
  {{- with .Values.backend.secret.openaiApiKey }}
  RCA_OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.secret.anthropicApiKey }}
  RCA_ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.secret.geminiApiKey }}
  RCA_GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
