{{- if .Values.platform.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cluster-infra-rca-platform.platformName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cluster-infra-rca-platform.platformSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- with .Values.platform.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- if .Values.database.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cluster-infra-rca-platform.databaseName" . }}
  labels:
    {{- include "cluster-infra-rca-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cluster-infra-rca-platform.databaseSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cluster-infra-rca-platform.platformSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ include "cluster-infra-rca-platform.databasePort" . }}
{{- end }}
{{- end }}
