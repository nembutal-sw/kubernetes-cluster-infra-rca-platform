{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-infra-rca-agent.secretName" . }}
  namespace: {{ include "cluster-infra-rca-agent.namespace" . }}
  labels:
    {{- include "cluster-infra-rca-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  cluster-id: {{ required "secret.clusterId is required when secret.create=true" .Values.secret.clusterId | quote }}
  {{ if eq (lower .Values.enrollment.mode) "bootstrap-token" }}
  agent-token: {{ required "secret.agentToken is required when secret.create=true" .Values.secret.agentToken | quote }}
  {{ end }}
{{- end }}
