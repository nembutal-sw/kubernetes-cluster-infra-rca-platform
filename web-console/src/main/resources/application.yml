server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      cookie:
        http-only: true
        same-site: strict

spring:
  application:
    name: cluster-infra-rca-platform
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${RCA_JDBC_URL:jdbc:h2:file:./data/rca;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${RCA_DB_USERNAME:sa}
    password: ${RCA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${RCA_DB_POOL_SIZE:10}
      minimum-idle: ${RCA_DB_MIN_IDLE:1}
      connection-timeout: 10000
      validation-timeout: 3000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  ai:
    model:
      chat: ${RCA_SPRING_AI_CHAT_MODEL:none}
      embedding: ${RCA_SPRING_AI_EMBEDDING_MODEL:none}
      image: ${RCA_SPRING_AI_IMAGE_MODEL:none}
      moderation: ${RCA_SPRING_AI_MODERATION_MODEL:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        rca.report.generation.duration: true
        rca.analysis.task.duration: true
        rca.evidence.collection.duration: true
        rca.llm.analysis.duration: true
        rca.maintenance.duration: true
      slo:
        rca.report.generation.duration: 1s,5s,15s,30s
        rca.analysis.task.duration: 5s,15s,30s,60s,300s
        rca.evidence.collection.duration: 10s,30s,60s,180s,300s
        rca.llm.analysis.duration: 1s,5s,15s,30s,60s
        rca.maintenance.duration: 1s,5s,15s,30s,60s

rca:
  public-api-base-url: ${RCA_PUBLIC_API_BASE_URL:}
  default-admin-username: ${RCA_DEFAULT_ADMIN_USERNAME:}
  default-admin-password: ${RCA_DEFAULT_ADMIN_PASSWORD:}
  webhook-token: ${RCA_WEBHOOK_TOKEN:}
  session-ttl-hours: ${RCA_SESSION_TTL_HOURS:12}
  agent-offline-after-seconds: ${RCA_AGENT_OFFLINE_AFTER_SECONDS:180}
  agent:
    image: ${RCA_AGENT_IMAGE:ghcr.io/example/cluster-infra-rca-agent:latest}
    namespace: ${RCA_AGENT_NAMESPACE:rca-system}
    expected-version: ${RCA_AGENT_EXPECTED_VERSION:}
    minimum-supported-version: ${RCA_AGENT_MINIMUM_SUPPORTED_VERSION:0.1.0}
    protocol-version: ${RCA_AGENT_PROTOCOL_VERSION:1}
    minimum-supported-protocol-version: ${RCA_AGENT_MINIMUM_SUPPORTED_PROTOCOL_VERSION:1}
    platform-version: ${RCA_PLATFORM_VERSION:0.1.0}
    poll-interval-seconds: ${RCA_AGENT_POLL_INTERVAL_SECONDS:30}
    http-timeout-seconds: ${RCA_AGENT_HTTP_TIMEOUT_SECONDS:20}
    command-timeout-seconds: ${RCA_AGENT_COMMAND_TIMEOUT_SECONDS:10}
  llm:
    enabled: ${RCA_LLM_ENABLED:false}
    provider: ${RCA_LLM_PROVIDER:none}
    model: ${RCA_LLM_MODEL:}
    max-output-tokens: ${RCA_LLM_MAX_OUTPUT_TOKENS:1800}
    timeout-seconds: ${RCA_LLM_TIMEOUT_SECONDS:30}
    max-attempts: ${RCA_LLM_MAX_ATTEMPTS:2}
    failure-threshold: ${RCA_LLM_FAILURE_THRESHOLD:3}
    cooldown-seconds: ${RCA_LLM_COOLDOWN_SECONDS:60}
  incident:
    correlation-window-minutes: ${RCA_INCIDENT_CORRELATION_WINDOW_MINUTES:15}
    minimum-score: ${RCA_INCIDENT_CORRELATION_MINIMUM_SCORE:70}
    candidate-limit: ${RCA_INCIDENT_CORRELATION_CANDIDATE_LIMIT:20}
    auto-resolve-enabled: ${RCA_INCIDENT_AUTO_RESOLVE_ENABLED:true}
    inactivity-minutes: ${RCA_INCIDENT_INACTIVITY_MINUTES:60}
    lifecycle-scan-interval-ms: ${RCA_INCIDENT_LIFECYCLE_SCAN_INTERVAL_MS:60000}
    lifecycle-initial-delay-ms: ${RCA_INCIDENT_LIFECYCLE_INITIAL_DELAY_MS:30000}
    lifecycle-batch-size: ${RCA_INCIDENT_LIFECYCLE_BATCH_SIZE:100}
    recurrence-lookback-hours: ${RCA_INCIDENT_RECURRENCE_LOOKBACK_HOURS:168}
  topology:
    enabled: ${RCA_TOPOLOGY_ENABLED:true}
    lookback-hours: ${RCA_TOPOLOGY_LOOKBACK_HOURS:24}
    observation-limit: ${RCA_TOPOLOGY_OBSERVATION_LIMIT:500}
  audit:
    enabled: ${RCA_AUDIT_ENABLED:true}
    retention-days: ${RCA_AUDIT_RETENTION_DAYS:180}
  maintenance:
    enabled: ${RCA_MAINTENANCE_ENABLED:true}
    cron: ${RCA_MAINTENANCE_CRON:0 17 3 * * *}
    batch-size: ${RCA_MAINTENANCE_BATCH_SIZE:250}
    evidence-retention-days: ${RCA_EVIDENCE_RETENTION_DAYS:30}
    evidence-request-retention-days: ${RCA_EVIDENCE_REQUEST_RETENTION_DAYS:30}
    analysis-task-retention-days: ${RCA_ANALYSIS_TASK_RETENTION_DAYS:30}
    realtime-event-retention-days: ${RCA_REALTIME_EVENT_RETENTION_DAYS:14}
    topology-observation-retention-days: ${RCA_TOPOLOGY_OBSERVATION_RETENTION_DAYS:30}
    report-retention-days: ${RCA_REPORT_RETENTION_DAYS:365}
  security:
    encryption-secret: ${RCA_ENCRYPTION_SECRET:}
    standard-request-max-bytes: ${RCA_STANDARD_REQUEST_MAX_BYTES:1048576}
    evidence-request-max-bytes: ${RCA_EVIDENCE_REQUEST_MAX_BYTES:10485760}
    manifest-token-ttl-seconds: ${RCA_MANIFEST_TOKEN_TTL_SECONDS:300}
    agent-mtls-required: ${RCA_AGENT_MTLS_REQUIRED:false}
  demo:
    enabled: ${RCA_DEMO_ENABLED:false}
  export:
    max-bundle-bytes: ${RCA_EXPORT_MAX_BUNDLE_BYTES:10485760}
  notification:
    enabled: ${RCA_NOTIFICATION_ENABLED:false}
    slack-webhook-url: ${RCA_SLACK_WEBHOOK_URL:}
    minimum-severity: ${RCA_NOTIFICATION_MINIMUM_SEVERITY:critical}
    max-attempts: ${RCA_NOTIFICATION_MAX_ATTEMPTS:2}
    timeout-seconds: ${RCA_NOTIFICATION_TIMEOUT_SECONDS:5}
  pipeline:
    enabled: ${RCA_PIPELINE_ENABLED:true}
    batch-size: ${RCA_PIPELINE_BATCH_SIZE:4}
    poll-interval-ms: ${RCA_PIPELINE_POLL_INTERVAL_MS:2000}
    initial-delay-ms: ${RCA_PIPELINE_INITIAL_DELAY_MS:3000}
    lease-seconds: ${RCA_PIPELINE_LEASE_SECONDS:300}
    max-attempts: ${RCA_PIPELINE_MAX_ATTEMPTS:5}
    retry-base-seconds: ${RCA_PIPELINE_RETRY_BASE_SECONDS:5}
    retry-max-seconds: ${RCA_PIPELINE_RETRY_MAX_SECONDS:300}
  thresholds:
    disk-warning-percent: ${RCA_THRESHOLD_DISK_WARNING_PERCENT:85}
    disk-critical-percent: ${RCA_THRESHOLD_DISK_CRITICAL_PERCENT:90}
    inode-warning-percent: ${RCA_THRESHOLD_INODE_WARNING_PERCENT:85}
    inode-critical-percent: ${RCA_THRESHOLD_INODE_CRITICAL_PERCENT:90}
    memory-critical-percent: ${RCA_THRESHOLD_MEMORY_CRITICAL_PERCENT:90}
    pid-warning-percent: ${RCA_THRESHOLD_PID_WARNING_PERCENT:85}
    conntrack-warning-percent: ${RCA_THRESHOLD_CONNTRACK_WARNING_PERCENT:80}
    conntrack-critical-percent: ${RCA_THRESHOLD_CONNTRACK_CRITICAL_PERCENT:95}
    disk-await-warning-ms: ${RCA_THRESHOLD_DISK_AWAIT_WARNING_MS:20}
    dns-latency-warning-ms: ${RCA_THRESHOLD_DNS_LATENCY_WARNING_MS:500}
    api-server-latency-warning-ms: ${RCA_THRESHOLD_API_SERVER_LATENCY_WARNING_MS:1000}
    etcd-latency-warning-ms: ${RCA_THRESHOLD_ETCD_LATENCY_WARNING_MS:500}
  monitoring:
    enabled: ${RCA_MONITORING_ENABLED:false}
    interval-ms: ${RCA_MONITORING_INTERVAL_MS:60000}
    initial-delay-ms: ${RCA_MONITORING_INITIAL_DELAY_MS:30000}
  observability:
    enabled: ${RCA_OBSERVABILITY_ENABLED:true}
    metrics-token: ${RCA_METRICS_TOKEN:}
    refresh-interval-ms: ${RCA_OBSERVABILITY_REFRESH_INTERVAL_MS:15000}
    initial-delay-ms: ${RCA_OBSERVABILITY_INITIAL_DELAY_MS:5000}
