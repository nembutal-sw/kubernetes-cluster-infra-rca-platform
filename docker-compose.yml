name: cluster-infra-rca

services:
  postgres:
    image: postgres:16
    container_name: rca-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rca}
      POSTGRES_USER: ${POSTGRES_USER:-rca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rca_password}
    ports:
      - "${RCA_DATABASE_BIND_ADDRESS:-127.0.0.1}:${RCA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  platform:
    build:
      context: .
      dockerfile: Dockerfile.web-console
    image: cluster-infra-rca-platform:local
    container_name: rca-platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      RCA_JDBC_URL: ${RCA_JDBC_URL:-jdbc:postgresql://postgres:5432/rca}
      RCA_DB_USERNAME: ${RCA_DB_USERNAME:-rca}
      RCA_DB_PASSWORD: ${RCA_DB_PASSWORD:-rca_password}
      RCA_DEFAULT_ADMIN_USERNAME: ${RCA_DEFAULT_ADMIN_USERNAME:-}
      RCA_DEFAULT_ADMIN_PASSWORD: ${RCA_DEFAULT_ADMIN_PASSWORD:-}
      RCA_WEBHOOK_TOKEN: ${RCA_WEBHOOK_TOKEN:-}
      RCA_STANDARD_REQUEST_MAX_BYTES: ${RCA_STANDARD_REQUEST_MAX_BYTES:-1048576}
      RCA_EVIDENCE_REQUEST_MAX_BYTES: ${RCA_EVIDENCE_REQUEST_MAX_BYTES:-10485760}
      RCA_MANIFEST_TOKEN_TTL_SECONDS: ${RCA_MANIFEST_TOKEN_TTL_SECONDS:-300}
      RCA_AGENT_BOOTSTRAP_TOKEN_TTL_SECONDS: ${RCA_AGENT_BOOTSTRAP_TOKEN_TTL_SECONDS:-1800}
      RCA_AGENT_MTLS_REQUIRED: ${RCA_AGENT_MTLS_REQUIRED:-false}
      RCA_SESSION_TTL_HOURS: ${RCA_SESSION_TTL_HOURS:-12}
      RCA_AGENT_OFFLINE_AFTER_SECONDS: ${RCA_AGENT_OFFLINE_AFTER_SECONDS:-180}
      RCA_AGENT_EXPECTED_VERSION: ${RCA_AGENT_EXPECTED_VERSION:-}
      RCA_AGENT_MINIMUM_SUPPORTED_VERSION: ${RCA_AGENT_MINIMUM_SUPPORTED_VERSION:-0.1.0}
      RCA_AGENT_PROTOCOL_VERSION: ${RCA_AGENT_PROTOCOL_VERSION:-2}
      RCA_AGENT_MINIMUM_SUPPORTED_PROTOCOL_VERSION: ${RCA_AGENT_MINIMUM_SUPPORTED_PROTOCOL_VERSION:-1}
      RCA_PLATFORM_VERSION: ${RCA_PLATFORM_VERSION:-0.1.0}
      RCA_MONITORING_ENABLED: ${RCA_MONITORING_ENABLED:-false}
      RCA_MONITORING_INTERVAL_MS: ${RCA_MONITORING_INTERVAL_MS:-60000}
      RCA_MONITORING_INITIAL_DELAY_MS: ${RCA_MONITORING_INITIAL_DELAY_MS:-30000}
      RCA_OBSERVABILITY_ENABLED: ${RCA_OBSERVABILITY_ENABLED:-true}
      RCA_METRICS_TOKEN: ${RCA_METRICS_TOKEN:-}
      RCA_OBSERVABILITY_REFRESH_INTERVAL_MS: ${RCA_OBSERVABILITY_REFRESH_INTERVAL_MS:-15000}
      RCA_OBSERVABILITY_INITIAL_DELAY_MS: ${RCA_OBSERVABILITY_INITIAL_DELAY_MS:-5000}
      RCA_PUBLIC_API_BASE_URL: ${RCA_PUBLIC_API_BASE_URL:-http://localhost:8080}
      RCA_LLM_ENABLED: ${RCA_LLM_ENABLED:-false}
      RCA_LLM_PROVIDER: ${RCA_LLM_PROVIDER:-none}
      RCA_LLM_MODEL: ${RCA_LLM_MODEL:-}
      RCA_SPRING_AI_CHAT_MODEL: ${RCA_SPRING_AI_CHAT_MODEL:-none}
      RCA_LLM_TIMEOUT_SECONDS: ${RCA_LLM_TIMEOUT_SECONDS:-30}
      RCA_LLM_MAX_OUTPUT_TOKENS: ${RCA_LLM_MAX_OUTPUT_TOKENS:-1800}
      RCA_LLM_MAX_ATTEMPTS: ${RCA_LLM_MAX_ATTEMPTS:-2}
      RCA_SPRING_AI_RETRY_MAX_ATTEMPTS: ${RCA_SPRING_AI_RETRY_MAX_ATTEMPTS:-1}
      RCA_LLM_FAILURE_THRESHOLD: ${RCA_LLM_FAILURE_THRESHOLD:-3}
      RCA_LLM_COOLDOWN_SECONDS: ${RCA_LLM_COOLDOWN_SECONDS:-60}
      RCA_LLM_INPUT_COST_PER_MILLION_TOKENS: ${RCA_LLM_INPUT_COST_PER_MILLION_TOKENS:-0}
      RCA_LLM_OUTPUT_COST_PER_MILLION_TOKENS: ${RCA_LLM_OUTPUT_COST_PER_MILLION_TOKENS:-0}
      RCA_INCIDENT_CORRELATION_WINDOW_MINUTES: ${RCA_INCIDENT_CORRELATION_WINDOW_MINUTES:-15}
      RCA_INCIDENT_CORRELATION_MINIMUM_SCORE: ${RCA_INCIDENT_CORRELATION_MINIMUM_SCORE:-70}
      RCA_INCIDENT_CORRELATION_CANDIDATE_LIMIT: ${RCA_INCIDENT_CORRELATION_CANDIDATE_LIMIT:-20}
      RCA_INCIDENT_AUTO_RESOLVE_ENABLED: ${RCA_INCIDENT_AUTO_RESOLVE_ENABLED:-true}
      RCA_INCIDENT_INACTIVITY_MINUTES: ${RCA_INCIDENT_INACTIVITY_MINUTES:-60}
      RCA_INCIDENT_LIFECYCLE_SCAN_INTERVAL_MS: ${RCA_INCIDENT_LIFECYCLE_SCAN_INTERVAL_MS:-60000}
      RCA_INCIDENT_LIFECYCLE_INITIAL_DELAY_MS: ${RCA_INCIDENT_LIFECYCLE_INITIAL_DELAY_MS:-30000}
      RCA_INCIDENT_LIFECYCLE_BATCH_SIZE: ${RCA_INCIDENT_LIFECYCLE_BATCH_SIZE:-100}
      RCA_INCIDENT_RECURRENCE_LOOKBACK_HOURS: ${RCA_INCIDENT_RECURRENCE_LOOKBACK_HOURS:-168}
      RCA_TOPOLOGY_ENABLED: ${RCA_TOPOLOGY_ENABLED:-true}
      RCA_TOPOLOGY_LOOKBACK_HOURS: ${RCA_TOPOLOGY_LOOKBACK_HOURS:-24}
      RCA_TOPOLOGY_OBSERVATION_LIMIT: ${RCA_TOPOLOGY_OBSERVATION_LIMIT:-500}
      RCA_AUDIT_ENABLED: ${RCA_AUDIT_ENABLED:-true}
      RCA_AUDIT_RETENTION_DAYS: ${RCA_AUDIT_RETENTION_DAYS:-180}
      RCA_MAINTENANCE_ENABLED: ${RCA_MAINTENANCE_ENABLED:-true}
      RCA_MAINTENANCE_CRON: "${RCA_MAINTENANCE_CRON:-0 17 3 * * *}"
      RCA_MAINTENANCE_BATCH_SIZE: ${RCA_MAINTENANCE_BATCH_SIZE:-250}
      RCA_EVIDENCE_RETENTION_DAYS: ${RCA_EVIDENCE_RETENTION_DAYS:-30}
      RCA_EVIDENCE_REQUEST_RETENTION_DAYS: ${RCA_EVIDENCE_REQUEST_RETENTION_DAYS:-30}
      RCA_ANALYSIS_TASK_RETENTION_DAYS: ${RCA_ANALYSIS_TASK_RETENTION_DAYS:-30}
      RCA_REALTIME_EVENT_RETENTION_DAYS: ${RCA_REALTIME_EVENT_RETENTION_DAYS:-14}
      RCA_TOPOLOGY_OBSERVATION_RETENTION_DAYS: ${RCA_TOPOLOGY_OBSERVATION_RETENTION_DAYS:-30}
      RCA_REPORT_RETENTION_DAYS: ${RCA_REPORT_RETENTION_DAYS:-365}
      RCA_DEMO_ENABLED: ${RCA_DEMO_ENABLED:-false}
      RCA_EXPORT_MAX_BUNDLE_BYTES: ${RCA_EXPORT_MAX_BUNDLE_BYTES:-10485760}
      RCA_EXPORT_SIGNATURE_SECRET: ${RCA_EXPORT_SIGNATURE_SECRET:-}
      RCA_EXPORT_SIGNATURE_KEY_ID: ${RCA_EXPORT_SIGNATURE_KEY_ID:-default}
      RCA_NOTIFICATION_ENABLED: ${RCA_NOTIFICATION_ENABLED:-false}
      RCA_SLACK_WEBHOOK_URL: ${RCA_SLACK_WEBHOOK_URL:-}
      RCA_NOTIFICATION_WEBHOOK_URL: ${RCA_NOTIFICATION_WEBHOOK_URL:-}
      RCA_NOTIFICATION_WEBHOOK_TOKEN: ${RCA_NOTIFICATION_WEBHOOK_TOKEN:-}
      RCA_NOTIFICATION_MINIMUM_SEVERITY: ${RCA_NOTIFICATION_MINIMUM_SEVERITY:-critical}
      RCA_NOTIFICATION_MAX_ATTEMPTS: ${RCA_NOTIFICATION_MAX_ATTEMPTS:-2}
      RCA_NOTIFICATION_TIMEOUT_SECONDS: ${RCA_NOTIFICATION_TIMEOUT_SECONDS:-5}
      RCA_NOTIFICATION_BATCH_SIZE: ${RCA_NOTIFICATION_BATCH_SIZE:-10}
      RCA_NOTIFICATION_POLL_INTERVAL_MS: ${RCA_NOTIFICATION_POLL_INTERVAL_MS:-1000}
      RCA_NOTIFICATION_INITIAL_DELAY_MS: ${RCA_NOTIFICATION_INITIAL_DELAY_MS:-3000}
      RCA_NOTIFICATION_LEASE_SECONDS: ${RCA_NOTIFICATION_LEASE_SECONDS:-60}
      RCA_NOTIFICATION_RETRY_BASE_SECONDS: ${RCA_NOTIFICATION_RETRY_BASE_SECONDS:-5}
      RCA_NOTIFICATION_RETRY_MAX_SECONDS: ${RCA_NOTIFICATION_RETRY_MAX_SECONDS:-300}
      RCA_GITOPS_ENABLED: ${RCA_GITOPS_ENABLED:-false}
      RCA_GITOPS_PROVIDER: ${RCA_GITOPS_PROVIDER:-github}
      RCA_GITOPS_API_BASE_URL: ${RCA_GITOPS_API_BASE_URL:-}
      RCA_GITOPS_REPOSITORY: ${RCA_GITOPS_REPOSITORY:-}
      RCA_GITOPS_BASE_BRANCH: ${RCA_GITOPS_BASE_BRANCH:-main}
      RCA_GITOPS_FILE_PATH: ${RCA_GITOPS_FILE_PATH:-ops/catalog/operational-catalog.override.json}
      RCA_GITOPS_TOKEN: ${RCA_GITOPS_TOKEN:-}
      RCA_GITOPS_WEBHOOK_SECRET: ${RCA_GITOPS_WEBHOOK_SECRET:-}
      RCA_GITOPS_TIMEOUT_SECONDS: ${RCA_GITOPS_TIMEOUT_SECONDS:-15}
      RCA_ENCRYPTION_SECRET: ${RCA_ENCRYPTION_SECRET:-}
      RCA_OPAQUE_TOKEN_PEPPER: ${RCA_OPAQUE_TOKEN_PEPPER:-development-only-opaque-token-pepper}
      RCA_OPAQUE_TOKEN_KEY_ID: ${RCA_OPAQUE_TOKEN_KEY_ID:-legacy}
      RCA_OPAQUE_TOKEN_PREVIOUS_KEYS: ${RCA_OPAQUE_TOKEN_PREVIOUS_KEYS:-}
      RCA_OPAQUE_TOKEN_WRITE_VERSION: ${RCA_OPAQUE_TOKEN_WRITE_VERSION:-v1}
      RCA_OPAQUE_TOKEN_REHASH_ON_AUTHENTICATION: ${RCA_OPAQUE_TOKEN_REHASH_ON_AUTHENTICATION:-false}
      RCA_PIPELINE_ENABLED: ${RCA_PIPELINE_ENABLED:-true}
      RCA_PIPELINE_BATCH_SIZE: ${RCA_PIPELINE_BATCH_SIZE:-4}
      RCA_PIPELINE_POLL_INTERVAL_MS: ${RCA_PIPELINE_POLL_INTERVAL_MS:-2000}
      RCA_PIPELINE_LEASE_SECONDS: ${RCA_PIPELINE_LEASE_SECONDS:-300}
      RCA_PIPELINE_MAX_ATTEMPTS: ${RCA_PIPELINE_MAX_ATTEMPTS:-5}
      RCA_PIPELINE_RETRY_BASE_SECONDS: ${RCA_PIPELINE_RETRY_BASE_SECONDS:-5}
      RCA_PIPELINE_RETRY_MAX_SECONDS: ${RCA_PIPELINE_RETRY_MAX_SECONDS:-300}
      SPRING_AI_OPENAI_SDK_API_KEY: ${OPENAI_API_KEY:-}
      SPRING_AI_OPENAI_SDK_BASE_URL: ${OPENAI_BASE_URL:-}
      SPRING_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GEMINI_API_KEY:-}
      SPRING_AI_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SERVER_PORT: 8080
    ports:
      - "${RCA_BIND_ADDRESS:-127.0.0.1}:${RCA_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    container_name: rca-mariadb
    profiles: ["mariadb"]
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-rca}
      MARIADB_USER: ${MARIADB_USER:-rca}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-rca_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
    ports:
      - "${RCA_DATABASE_BIND_ADDRESS:-127.0.0.1}:${RCA_MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  mariadb-data:
