[project]
name = "kubernetes-cluster-infra-rca-platform"
version = "0.1.0"
description = "AI-based Kubernetes cluster infrastructure RCA platform backend MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

