apiVersion: v1
kind: Namespace
metadata:
  name: rca-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-infra-rca-agent
  namespace: rca-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-infra-rca-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/readyz", "/readyz/*", "/livez", "/livez/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-infra-rca-agent
subjects:
  - kind: ServiceAccount
    name: cluster-infra-rca-agent
    namespace: rca-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-infra-rca-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-infra-rca-agent-config
  namespace: rca-system
data:
  BACKEND_URL: "https://rca.example.com"
  POLL_INTERVAL_SECONDS: "15"
  HTTP_TIMEOUT_SECONDS: "10"
  COMMAND_TIMEOUT_SECONDS: "5"
  KUBERNETES_API_TIMEOUT_SECONDS: "5"
  CONTROL_PLANE_PROBE_PORTS: "6443,9345"
  CONTAINER_RUNTIME_SOCKET_PATHS: ""
  SYSTEMD_COLLECTOR_MODE: "file"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cluster-infra-rca-agent
  namespace: rca-system
  labels:
    app.kubernetes.io/name: cluster-infra-rca-agent
    app.kubernetes.io/part-of: cluster-infra-rca
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-infra-rca-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-infra-rca-agent
        app.kubernetes.io/part-of: cluster-infra-rca
    spec:
      serviceAccountName: cluster-infra-rca-agent
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 20
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: ghcr.io/example/cluster-infra-rca-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "node_agent.main"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: BACKEND_URL
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: cluster-infra-rca-agent
                  key: cluster-id
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cluster-infra-rca-agent
                  key: agent-token
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POLL_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: POLL_INTERVAL_SECONDS
            - name: HTTP_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: HTTP_TIMEOUT_SECONDS
            - name: COMMAND_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: COMMAND_TIMEOUT_SECONDS
            - name: KUBERNETES_API_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: KUBERNETES_API_TIMEOUT_SECONDS
            - name: CONTROL_PLANE_PROBE_PORTS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: CONTROL_PLANE_PROBE_PORTS
            - name: CONTAINER_RUNTIME_SOCKET_PATHS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: CONTAINER_RUNTIME_SOCKET_PATHS
            - name: SYSTEMD_COLLECTOR_MODE
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: SYSTEMD_COLLECTOR_MODE
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: host-root
              mountPath: /host/root
              readOnly: true
            - name: host-var-log
              mountPath: /host/var/log
              readOnly: true
            - name: host-run
              mountPath: /host/run
              readOnly: true
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: host-var-log
          hostPath:
            path: /var/log
        - name: host-run
          hostPath:
            path: /run
        - name: host-etc
          hostPath:
            path: /etc
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
