apiVersion: v1
kind: Namespace
metadata:
  name: rca-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-infra-rca-agent
  namespace: rca-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-infra-rca-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "services", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/readyz", "/readyz/*", "/livez", "/livez/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-infra-rca-agent
subjects:
  - kind: ServiceAccount
    name: cluster-infra-rca-agent
    namespace: rca-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-infra-rca-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-infra-rca-agent-config
  namespace: rca-system
data:
  AGENT_MODE: "safe"
  BACKEND_URL: "https://rca.example.com"
  POLL_INTERVAL_SECONDS: "15"
  HTTP_TIMEOUT_SECONDS: "10"
  COMMAND_TIMEOUT_SECONDS: "5"
  RETRY_INITIAL_SECONDS: "2"
  RETRY_MAX_SECONDS: "120"
  AGENT_MAX_SPOOL_FILES: "1000"
  AGENT_MAX_SPOOL_BYTES: "268435456"
  KUBERNETES_API_TIMEOUT_SECONDS: "5"
  KUBERNETES_API_MAX_ATTEMPTS: "2"
  KUBERNETES_API_URL: ""
  KUBERNETES_API_MAX_RESPONSE_BYTES: "8388608"
  KUBERNETES_API_CACHE_TTL_SECONDS: "10"
  KUBERNETES_TOPOLOGY_ENABLED: "true"
  KUBERNETES_TOPOLOGY_MAX_ITEMS: "500"
  AGENT_EVIDENCE_MAX_BYTES: "8388608"
  HOST_LOG_MAX_FILES: "12"
  HOST_LOG_MAX_BYTES_PER_FILE: "262144"
  HOST_LOG_MAX_LINES: "80"
  EBPF_ENABLED: "false"
  CONTROL_PLANE_PROBE_PORTS: "6443,9345"
  CONTAINER_RUNTIME_SOCKET_PATHS: ""
  SYSTEMD_COLLECTOR_MODE: "file"
  AGENT_STATE_DIR: "/var/lib/cluster-infra-rca-agent"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cluster-infra-rca-agent
  namespace: rca-system
  labels:
    app.kubernetes.io/name: cluster-infra-rca-agent
    app.kubernetes.io/part-of: cluster-infra-rca
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-infra-rca-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-infra-rca-agent
        app.kubernetes.io/part-of: cluster-infra-rca
    spec:
      serviceAccountName: cluster-infra-rca-agent
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 20
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: ghcr.io/example/cluster-infra-rca-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "node_agent.main"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: BACKEND_URL
            - name: AGENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: AGENT_MODE
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: cluster-infra-rca-agent
                  key: cluster-id
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cluster-infra-rca-agent
                  key: agent-token
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POLL_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: POLL_INTERVAL_SECONDS
            - name: HTTP_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: HTTP_TIMEOUT_SECONDS
            - name: COMMAND_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: COMMAND_TIMEOUT_SECONDS
            - name: RETRY_INITIAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: RETRY_INITIAL_SECONDS
            - name: RETRY_MAX_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: RETRY_MAX_SECONDS
            - name: AGENT_MAX_SPOOL_FILES
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: AGENT_MAX_SPOOL_FILES
            - name: AGENT_MAX_SPOOL_BYTES
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: AGENT_MAX_SPOOL_BYTES
            - name: KUBERNETES_API_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: KUBERNETES_API_TIMEOUT_SECONDS
            - name: KUBERNETES_API_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: KUBERNETES_API_MAX_ATTEMPTS
            - name: KUBERNETES_API_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: KUBERNETES_API_URL
            - name: KUBERNETES_API_MAX_RESPONSE_BYTES
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: KUBERNETES_API_MAX_RESPONSE_BYTES
            - name: KUBERNETES_API_CACHE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: KUBERNETES_API_CACHE_TTL_SECONDS
            - name: KUBERNETES_TOPOLOGY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: KUBERNETES_TOPOLOGY_ENABLED
            - name: KUBERNETES_TOPOLOGY_MAX_ITEMS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: KUBERNETES_TOPOLOGY_MAX_ITEMS
            - name: AGENT_EVIDENCE_MAX_BYTES
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: AGENT_EVIDENCE_MAX_BYTES
            - name: HOST_LOG_MAX_FILES
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: HOST_LOG_MAX_FILES
            - name: HOST_LOG_MAX_BYTES_PER_FILE
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: HOST_LOG_MAX_BYTES_PER_FILE
            - name: HOST_LOG_MAX_LINES
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: HOST_LOG_MAX_LINES
            - name: EBPF_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: EBPF_ENABLED
            - name: CONTROL_PLANE_PROBE_PORTS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: CONTROL_PLANE_PROBE_PORTS
            - name: CONTAINER_RUNTIME_SOCKET_PATHS
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: CONTAINER_RUNTIME_SOCKET_PATHS
            - name: SYSTEMD_COLLECTOR_MODE
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: SYSTEMD_COLLECTOR_MODE
            - name: AGENT_STATE_DIR
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: AGENT_STATE_DIR
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: agent-state
              mountPath: /var/lib/cluster-infra-rca-agent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: agent-state
          emptyDir: {}
