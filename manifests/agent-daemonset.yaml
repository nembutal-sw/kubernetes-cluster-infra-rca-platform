apiVersion: v1
kind: Namespace
metadata:
  name: rca-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-infra-rca-agent
  namespace: rca-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-infra-rca-agent-config
  namespace: rca-system
data:
  BACKEND_URL: "https://rca.example.com"
  CLUSTER_ID: "replace-me"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cluster-infra-rca-agent
  namespace: rca-system
  labels:
    app.kubernetes.io/name: cluster-infra-rca-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-infra-rca-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-infra-rca-agent
    spec:
      serviceAccountName: cluster-infra-rca-agent
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: ghcr.io/example/cluster-infra-rca-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: BACKEND_URL
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: cluster-infra-rca-agent-config
                  key: CLUSTER_ID
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: host-var-log
              mountPath: /host/var/log
              readOnly: true
            - name: host-run-systemd
              mountPath: /host/run/systemd
              readOnly: true
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: containerd-sock
              mountPath: /host/run/containerd/containerd.sock
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: host-var-log
          hostPath:
            path: /var/log
        - name: host-run-systemd
          hostPath:
            path: /run/systemd
        - name: host-etc
          hostPath:
            path: /etc
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket

